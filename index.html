<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ValueMart Bike Rush</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap');
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#071a3a;font-family:Nunito,system-ui,sans-serif;color:#fff}
    .shell{width:min(1000px,100vw);padding:16px;background:linear-gradient(135deg,#0b2d68,#071a3a 60%);border:3px solid #ffc928;border-radius:24px;box-shadow:0 24px 70px #0009}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 14px}.tag{color:#9ed6ff;font-size:10px;font-weight:900;letter-spacing:.18em}.title{margin:1px 0 0;font:clamp(30px,5vw,54px) Bangers,sans-serif;letter-spacing:.035em;color:#ffce27;text-shadow:3px 4px #ec3d4b}.hud{display:flex;gap:8px}.stat{min-width:80px;padding:5px 10px;border:1px solid #ffffff44;border-radius:10px;background:#ffffff12;text-align:center;color:#a7cdf5;font-size:10px}.stat b{display:block;color:#fff;font-size:18px}
    .stage{position:relative;overflow:hidden;aspect-ratio:16/10;border:4px solid #ffce27;border-radius:17px;background:#dfe8e9}.stage:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 55px #06132a44}canvas{display:block;width:100%;height:100%;touch-action:none}.screen{position:absolute;z-index:2;inset:0;display:grid;place-items:center;padding:20px;background:#06183add}.screen.gone{display:none}.card{max-width:480px;padding:27px;border:2px solid #ffce27;border-radius:19px;background:#0c2e68f7;text-align:center;box-shadow:0 12px 35px #0008}.card .big{font-size:58px}.card h2{margin:4px 0 9px;font:42px Bangers,sans-serif;letter-spacing:.05em;color:#ffce27}.card p{margin:8px 0;line-height:1.45;font-size:14px;color:#d7edff}.go{margin-top:10px;border:0;border-radius:10px;padding:12px 19px;background:#ffce27;color:#142550;font:900 15px Nunito,sans-serif;cursor:pointer;box-shadow:0 4px #ce761a}.go:active{transform:translateY(3px);box-shadow:0 1px #ce761a}.controls{display:flex;justify-content:center;gap:8px;padding-top:12px}.controls button{border:1px solid #ffffff55;border-radius:9px;padding:8px 13px;background:#ffffff15;color:#fff;font:900 12px Nunito,sans-serif;cursor:pointer}.controls button:active{background:#ec3d4b}@media(max-width:600px){.shell{padding:7px;border-radius:0;border-width:0}.tag{display:none}.hud .stat{min-width:58px;padding:3px 6px}.hud .stat:nth-child(2){display:none}.stage{border-width:2px}.controls button{padding:8px}.card{padding:20px}.card h2{font-size:34px}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><div class="tag">AFTER-HOURS DELIVERY LEAGUE</div><h1 class="title">VALUEMART BIKE RUSH</h1></div><div class="hud"><div class="stat">BAGS<b id="bags">0 / 10</b></div><div class="stat">TIME<b id="time">60</b></div><div class="stat">BIKE<b id="life">♥♥♥</b></div></div></header>
  <section class="stage"><canvas id="game" width="960" height="600"></canvas><div class="screen" id="screen"><div class="card"><div class="big">🚲 🛒 💨</div><h2>SHOP 'TIL YOU DROP!</h2><p>Ride your bike through ValueMart after closing. Collect 10 grocery bags, dodge carts and displays, then pedal to the glowing checkout.</p><button class="go" id="start">START THE RUSH</button><p style="font-size:11px">Arrow keys / WASD to ride · touch and drag on mobile</p></div></div></section>
  <div class="controls"><button data-key="ArrowLeft">◀ LEFT</button><button data-key="ArrowUp">▲ PEDAL</button><button data-key="ArrowRight">RIGHT ▶</button></div>
</main>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),screen=document.querySelector('#screen'),bagsEl=document.querySelector('#bags'),timeEl=document.querySelector('#time'),lifeEl=document.querySelector('#life');
const W=960,H=600, keys={}; let playing=false,last=0,timer=60,bags=0,life=3,flash=0,shake=0,player,items,hazards,exit,particles=[];
function reset(){timer=60;bags=0;life=3;flash=0;shake=0;player={x:115,y:515,a:-.1,speed:0,inv:0}; exit={x:855,y:82,w:90,h:52};items=[{x:205,y:135},{x:430,y:110},{x:710,y:145},{x:145,y:305},{x:380,y:290},{x:640,y:295},{x:830,y:330},{x:270,y:465},{x:520,y:470},{x:755,y:490}].map((p,i)=>({...p,got:false,bob:i}));hazards=[{x:340,y:180,t:'cart'},{x:570,y:165,t:'spill'},{x:815,y:205,t:'cart'},{x:245,y:360,t:'display'},{x:500,y:380,t:'cart'},{x:700,y:410,t:'display'},{x:400,y:520,t:'spill'}];updateHud()}
function updateHud(){bagsEl.textContent=`${bags} / 10`;timeEl.textContent=Math.max(0,Math.ceil(timer));lifeEl.textContent='♥'.repeat(life)+'♡'.repeat(3-life)}
function rect(px,py,rx,ry,rw,rh){return px>rx-rw/2&&px<rx+rw/2&&py>ry-rh/2&&py<ry+rh/2} function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function burst(px,py,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,v=35+Math.random()*120;particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.5+Math.random()*.5,col})}}
function hit(){if(player.inv>0)return; life--;player.inv=1.35;shake=.35;flash=.18;burst(player.x,player.y,'#ed4051');updateHud();if(!life)finish(false)}
function finish(win){playing=false;screen.classList.remove('gone');screen.innerHTML=`<div class="card"><div class="big">${win?'🏁🛍️🏆':'💥🚲'}</div><h2>${win?'CHECKED OUT!':'BIKE DOWN!'}</h2><p>${win?`You grabbed every bag with <b>${Math.max(0,Math.ceil(timer))} seconds</b> to spare. ValueMart will never know what happened.`:`You collected <b>${bags} bags</b>. The carts won this round.`}</p><button class="go" id="again">${win?'RIDE AGAIN':'TRY AGAIN'}</button></div>`;document.querySelector('#again').onclick=start}
function start(){reset();screen.classList.add('gone');playing=true;last=performance.now();requestAnimationFrame(loop)}
function step(dt){let turn=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0), pedal=(keys.ArrowUp||keys.w?1:0)-(keys.ArrowDown||keys.s?1:0);player.speed+=pedal*260*dt;player.speed*=Math.pow(.12,dt);player.speed=Math.max(-75,Math.min(245,player.speed));player.a+=turn*2.7*dt*(.35+Math.abs(player.speed)/180);player.x+=Math.cos(player.a)*player.speed*dt;player.y+=Math.sin(player.a)*player.speed*dt;player.x=Math.max(30,Math.min(W-30,player.x));player.y=Math.max(30,Math.min(H-30,player.y));player.inv-=dt;timer-=dt;flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);if(timer<=0)finish(false);items.forEach(o=>{o.bob+=dt*4;if(!o.got&&dist(player,o)<28){o.got=true;bags++;burst(o.x,o.y,'#ffcc26');updateHud()}});hazards.forEach(h=>{let radius=h.t==='spill'?27:35;if(dist(player,h)<radius)hit()});if(bags===10&&rect(player.x,player.y,exit.x,exit.y,exit.w,exit.h))finish(true);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt;p.t-=dt});particles=particles.filter(p=>p.t>0)}
function tx(t,px,py,size,col='#18365b'){x.fillStyle=col;x.font=`900 ${size}px Nunito`;x.textAlign='center';x.fillText(t,px,py)}
function drawStore(){x.fillStyle='#e9eef0';x.fillRect(0,0,W,H);for(let i=0;i<W;i+=80){x.fillStyle=i%160?'#d7e0e3':'#cbd7da';x.fillRect(i,0,42,H)}x.fillStyle='#f8faf4';for(let yy=0;yy<H;yy+=90){x.fillRect(0,yy,W,43)}x.strokeStyle='#b8c6c8';x.lineWidth=2;for(let yy=0;yy<H;yy+=90){x.beginPath();x.moveTo(0,yy+43);x.lineTo(W,yy+43);x.stroke()}for(let yy=0;yy<H;yy+=90){for(let xx=0;xx<W;xx+=160){x.fillStyle='#fff';x.fillRect(xx+16,yy+13,83,9)}}
  [[205,62,'PRODUCE'],[475,62,'SNACKS'],[725,62,'HOME GOODS'],[130,245,'TOYS'],[390,245,'DAIRY'],[675,245,'FROZEN'],[875,455,'CHECKOUT']].forEach(s=>{x.fillStyle='#195aa4';x.fillRect(s[0]-59,s[1],118,24);tx(s[2],s[0],s[1]+17,11,'#fff')});
  x.fillStyle=bags===10?'#79df8b':'#b6c6c8';x.fillRect(exit.x-exit.w/2,exit.y-exit.h/2,exit.w,exit.h);x.strokeStyle=bags===10?'#17873c':'#78898b';x.lineWidth=4;x.strokeRect(exit.x-exit.w/2,exit.y-exit.h/2,exit.w,exit.h);tx(bags===10?'GO!':'10 BAGS',exit.x,exit.y+5,15,bags===10?'#075d24':'#54666c')}
function drawHazard(h){x.save();x.translate(h.x,h.y);if(h.t==='cart'){x.strokeStyle='#6c7b83';x.lineWidth=7;x.strokeRect(-22,-15,42,25);x.beginPath();x.moveTo(20,-12);x.lineTo(30,-27);x.lineTo(43,-27);x.stroke();x.fillStyle='#273943';[-16,16].forEach(q=>{x.beginPath();x.arc(q,16,5,0,7);x.fill()})}else if(h.t==='display'){x.fillStyle='#db7751';x.fillRect(-27,-24,54,48);x.fillStyle='#ffd247';x.fillRect(-23,-18,46,8);x.fillStyle='#fff';x.fillRect(-20,-5,40,8);tx('SALE',0,18,11,'#fff')}else{x.fillStyle='#86b9df';x.beginPath();x.ellipse(0,0,29,17,0,0,7);x.fill();x.fillStyle='#dff6ff';x.beginPath();x.ellipse(-8,-4,12,6,0,0,7);x.fill()}x.restore()}
function drawBag(o){if(o.got)return;x.save();x.translate(o.x,o.y+Math.sin(o.bob)*4);x.fillStyle='#ffca27';x.fillRect(-12,-10,24,24);x.strokeStyle='#8e5b19';x.lineWidth=3;x.beginPath();x.arc(0,-10,7,Math.PI,0);x.stroke();tx('!',0,10,17,'#db3d41');x.restore()}
function drawBike(){x.save();x.translate(player.x,player.y);x.rotate(player.a);x.globalAlpha=player.inv>0&&Math.floor(player.inv*14)%2?0.35:1;x.strokeStyle='#183c81';x.lineWidth=5;[[-13,0],[14,0]].forEach(q=>{x.beginPath();x.arc(q[0],q[1],10,0,7);x.stroke()});x.strokeStyle='#ec3d4b';x.lineWidth=6;x.beginPath();x.moveTo(-13,0);x.lineTo(-2,-15);x.lineTo(13,0);x.lineTo(-3,0);x.lineTo(5,-23);x.moveTo(-2,-15);x.lineTo(7,-15);x.stroke();x.fillStyle='#183c81';x.beginPath();x.arc(-2,-26,8,0,7);x.fill();x.restore()}
function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake*22,(Math.random()-.5)*shake*22);drawStore();hazards.forEach(drawHazard);items.forEach(drawBag);drawBike();particles.forEach(p=>{x.globalAlpha=Math.min(1,p.t*2);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill()});x.restore();if(flash){x.fillStyle='#ed405144';x.fillRect(0,0,W,H)}if(bags<10){x.fillStyle='#153d72cc';x.fillRect(12,12,182,32);tx('COLLECT THE BAGS!',103,34,14,'#fff')}}
function loop(now){if(!playing)return;let dt=Math.min(.04,(now-last)/1000);last=now;step(dt);draw();requestAnimationFrame(loop)}
document.querySelector('#start').onclick=start;document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>keys[k]=false))});let pointer; c.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!pointer||!playing)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(dx,dy)>13){player.a=Math.atan2(dy,dx);player.speed=190;pointer={x:e.clientX,y:e.clientY}}});c.addEventListener('pointerup',()=>pointer=null);reset();draw();
</script>
</body>
</html>
